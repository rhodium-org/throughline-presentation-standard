uid: CON-0002
type: constraint
status: ratified
title: Nothing private is in the standard
text: The standard is public. It names no tenant, client, person, brand, product
  of a tenant or internal system, and holds no value only one of them uses.
rationale: The repository is public by choice; anything one keeper needs is added
  by that keeper's own graph.
normative: true
