uid: CON-0003
type: constraint
status: proposed
title: A change that would fail a conforming series is a new major edition
text: The standard is released as tagged editions. An edition that removes or narrows
  anything a conforming series may rely on is a new major, and its notes say what
  a series must change.
rationale: Once series inherit the standard, every one that moves its pin takes a
  change at once.
normative: true
