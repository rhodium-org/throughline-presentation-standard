uid: RULE-0015
type: rule
status: ratified
title: A series' cover mark alt
text: 'A series may record cover_mark_alt: what the cover mark says, for those who
  cannot see it. Its value is text. Required. Part of what a signature on the item
  covers.'
rationale: 'Declared in throughline.toml as [types.series] attrs.cover_mark_alt =
  {"type": "string", "required": true, "normative": true}.'
normative: true
