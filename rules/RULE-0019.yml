uid: RULE-0019
type: rule
status: proposed
title: A series's motif
text: 'A series may record motif: a picture drawn on the dividers of every deck in
  the series. Its value is text.'
rationale: 'Declared in throughline.toml as [types.series] attrs.motif = {"type":
  "string"}.'
