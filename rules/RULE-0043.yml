uid: RULE-0043
type: rule
status: ratified
title: A source's published
text: 'A source may record published: the day it was published; documentation may
  have none. Its value is a date. Part of what a signature on the item covers.'
rationale: 'Declared in throughline.toml as [types.source] attrs.published = {"type":
  "date", "normative": true}.'
normative: true
