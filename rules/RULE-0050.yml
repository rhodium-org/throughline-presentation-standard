uid: RULE-0050
type: rule
status: proposed
title: A role's tools
text: 'A role may record tools: the tools of the role''s trade, one to a line. Its
  value is text. Required. Part of what a signature on the item covers.'
rationale: 'Declared in throughline.toml as [types.role] attrs.tools = {"type": "text",
  "required": true, "normative": true}.'
normative: true
