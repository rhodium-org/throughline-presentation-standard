title: A edition's motif alt
text: 'A edition may record motif_alt: what the deck''s motif says, for those who
  cannot see it. Its value is text. Part of what a signature on the item covers.'
rationale: 'Declared in throughline.toml as [types.edition] attrs.motif_alt = {"type":
  "string", "normative": true}.'
normative: true
