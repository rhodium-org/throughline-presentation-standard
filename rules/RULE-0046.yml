uid: RULE-0046
type: rule
status: proposed
title: A claim's product
text: 'A claim may record product: the product a product claim is about, matched
  to its source''s official_for. Its value is text. Part of what a signature on the
  item covers.'
rationale: 'Declared in throughline.toml as [types.claim] attrs.product = {"type":
  "string", "normative": true}.'
normative: true
