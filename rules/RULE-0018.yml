uid: RULE-0018
type: rule
status: proposed
title: A series's marking
text: 'A series may record marking: the word shown at the top and bottom of every
  slide after the cover; a series with none has no marking. Its value is text. Part
  of what a signature on the item covers.'
rationale: 'Declared in throughline.toml as [types.series] attrs.marking = {"type":
  "string", "normative": true}.'
normative: true
