uid: RULE-0022
type: rule
status: proposed
title: A edition's news from
text: 'A edition may record news_from: the first day of the news a briefing edition
  covers. Its value is a date.'
rationale: 'Declared in throughline.toml as [types.edition] attrs.news_from = {"type":
  "date"}.'
normative: true
