title: A role's tasks
text: 'A role may record tasks: what the role does on an engagement, one to a line.
  Its value is text. Required. Part of what a signature on the item covers.'
rationale: 'Declared in throughline.toml as [types.role] attrs.tasks = {"type": "text",
  "required": true, "normative": true}.'
normative: true
