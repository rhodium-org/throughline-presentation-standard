uid: RULE-0031
type: rule
status: proposed
title: A edition's subject kind
text: 'A edition may record subject_kind: whether a training edition''s subject is
  a role, a product, or ground common to every role. Its value is one of role, product,
  common. Part of what a signature on the item covers.'
rationale: 'Declared in throughline.toml as [types.edition] attrs.subject_kind =
  {"type": "enum", "values": ["role", "product", "common"], "normative": true}.'
normative: true
