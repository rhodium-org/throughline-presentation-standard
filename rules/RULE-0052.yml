uid: RULE-0052
type: rule
status: proposed
title: A series, a source, a topic and a role may stand on their own
text: Series, source, topic and role items may exist without a grounding link; every
  other kind of item a series holds must reach one through its links. A series that
  nothing derives from is a finding.
rationale: 'Declared in throughline.toml under [grounding]: root_types adds series,
  source, topic and role, and delivery_roots adds series.'
normative: true
