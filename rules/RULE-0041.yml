title: A source's publisher
text: 'A source may record publisher: who published it. Its value is text. Required.
  Part of what a signature on the item covers.'
rationale: 'Declared in throughline.toml as [types.source] attrs.publisher = {"type":
  "string", "required": true, "normative": true}.'
