uid: RULE-0005
type: rule
status: ratified
title: A source is a kind of item a series holds
text: 'A source is one document a claim rests on: where it is, who published it,
  when it was published and when it was last checked. A source may stand on its own.'
rationale: Declared in throughline.toml as [types.source].
