uid: RULE-0053
type: rule
status: ratified
title: The links a series graph uses
text: A series graph links its items with derives_from, implements, mitigates and
  verifies, which carry grounding, and with refines, satisfies, relates, assumes
  and includes. A training deck includes a thread that belongs to another deck of
  its series.
