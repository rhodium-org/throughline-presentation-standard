uid: RULE-0007
type: rule
status: proposed
title: A topic is a kind of item a series holds
text: A topic is a subject a series covers, recorded so a topic already covered is
  not repeated unnoticed. A topic may stand on its own.
rationale: Declared in throughline.toml as [types.topic].
normative: true
