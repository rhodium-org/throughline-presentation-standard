uid: RULE-0045
type: rule
status: ratified
title: A claim's role
text: 'A claim may record role: whether the claim is news, background, guidance or
  about a product. Its value is one of news, background, guidance, product. Required.
  Part of what a signature on the item covers.'
rationale: 'Declared in throughline.toml as [types.claim] attrs.role = {"type": "enum",
  "values": ["news", "background", "guidance", "product"], "required": true, "normative":
  true}.'
normative: true
