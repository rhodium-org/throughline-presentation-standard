uid: RULE-0013
type: rule
status: ratified
title: A series's cover title
text: 'A series may record cover_title: the words beside the series mark on the cover.
  Its value is text. Required. Part of what a signature on the item covers.'
rationale: 'Declared in throughline.toml as [types.series] attrs.cover_title = {"type":
  "string", "required": true, "normative": true}.'
normative: true
