uid: RULE-0039
type: rule
status: proposed
title: A thread's narration
text: 'A thread may record narration: a person''s wording of what is spoken over
  the divider, in place of a narration made from the notes. Its value is text.'
rationale: 'Declared in throughline.toml as [types.thread] attrs.narration = {"type":
  "text"}.'
normative: true
