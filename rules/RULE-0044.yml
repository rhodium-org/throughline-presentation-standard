title: A source's official for
text: 'A source may record official_for: the product the source is its maker''s own
  word on. Its value is text. Part of what a signature on the item covers.'
rationale: 'Declared in throughline.toml as [types.source] attrs.official_for = {"type":
  "string", "normative": true}.'
