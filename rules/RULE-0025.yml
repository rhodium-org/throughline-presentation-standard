uid: RULE-0025
type: rule
status: proposed
title: A edition's narration
text: 'A edition may record narration: a person''s wording of what is spoken over
  the cover, in place of a narration made from the notes. Its value is text.'
rationale: 'Declared in throughline.toml as [types.edition] attrs.narration = {"type":
  "text"}.'
