uid: RULE-0055
type: rule
status: ratified
title: A series pins an edition of the standard
text: A series names the standard, directly or through the graph it takes its schema
  from, at a tagged edition, never at a branch, so that a new edition reaches it
  only when it moves its pin.
rationale: A branch would carry every change, breaking ones included, to every follower
  at once.
normative: true
