uid: RULE-0014
type: rule
status: proposed
title: A series's cover mark
text: 'A series may record cover_mark: the picture that completes the series name
  on the cover. Its value is text. Required.'
rationale: 'Declared in throughline.toml as [types.series] attrs.cover_mark = {"type":
  "string", "required": true}.'
