title: A series's cover mark shapes
text: 'A series''s cover_mark_shapes: optional; not part of what a signature covers.'
rationale: 'The series mark drawn as shapes of the slide, so it can move in parts:
  a JSON list of boxes, each with x, y, w and h in units of the mark''s height, a
  fill colour, and lines of text with size and weight. cover_mark stays the picture
  shown where shapes cannot be.'
