uid: REG-0009
type: register
status: proposed
title: A series graph's sources live in SRC
text: A series graph holds its source items in SRC, folder sources/.
rationale: 'A source is one document a claim rests on: where it is, who published
  it, when it was published and when it was last checked. A source may stand on its
  own.'
normative: true
