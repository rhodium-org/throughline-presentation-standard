[project]
name = "Presentation format standard (throughline source)"
format_version = 4
suggested_namespace = "presentation"

# The meta-standard: the six kinds of declaration this standard is written in,
# and the base types its declarations build on (throughline SR-0285).
[[sources]]
namespace = "meta"
url = "https://github.com/rhodium-org/throughline-standard-standard"
ref = "v1.0.0"
schema = true

[grounding]
# RULE-0052
# RULE-0052
# RULE-0052
# RULE-0052
root_types = ["business_need", "risk", "constraint", "assumption", "non_goal",
              "series", "source", "topic", "role"]
# RULE-0052
delivery_roots = ["business_need", "risk", "constraint", "series"]

# The registers, attributes, links and link types a series graph holds are
# declared as items: registers/, types/, enums/, attributes/, links/ and
# link-types/. Each takes the ratified rule that justifies it as its rationale.

[status]
# draft = actively moving toward approval; deferred = acknowledged and grounded
# but deliberately parked (a backlog wish-list item, not on the active front).
values = ["deferred", "implemented", "verified"]

# Allowed status moves (SR-0083). `tl check` compares each item against its
# status in the previous commit and flags any change these do not permit. Delete
# this table to leave every status freely reachable.
# Every live status keeps a route to 'ratified' (SR-0150) — in particular the two
# statuses below 'proposed' can move back to it, so scope that was authored or
# parked without ratification can still be put forward for a human to accept.
# Every live status also keeps a route to 'suspect' (SR-0175), so that an item
# whose grounding is withdrawn can be flagged wherever it currently sits — the
# statuses below 'ratified' hold the items whose grounding is least settled.
# RULE-0054: the moves between statuses
[transitions]
proposed    = ["draft", "ratified", "deferred", "suspect", "rejected", "deleted"]
draft       = ["proposed", "deferred", "suspect", "rejected", "deleted"]
deferred    = ["proposed", "draft", "suspect", "rejected", "deleted"]
ratified    = ["implemented", "suspect", "rejected", "deleted"]
implemented = ["verified", "suspect", "rejected", "deleted"]
verified    = ["implemented", "suspect", "deleted"]
suspect     = ["ratified", "implemented", "verified", "rejected", "deleted"]
rejected    = ["draft", "deleted"]


# Conformance is shown, not asserted: every rule has an example that verifies
# it (presentation-manager shape NEED-0038, DEC-0034)
[[rules.coverage]]
filter = "type == 'rule' and status != 'deleted'"
needs = "incoming:verifies"
severity = "warning"
